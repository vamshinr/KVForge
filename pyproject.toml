[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipstream"
version = "0.1.0"
description = "Decode-optimized LLM inference path for AMD Instinct MI300X — paged FP8 KV cache, continuous batching, autotuned Triton."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Vamshi Nagireddy"}]
keywords = ["llm", "inference", "decode", "triton", "rocm", "mi300x", "paged-attention", "fp8", "kv-cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24",
    "tabulate>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
triton = ["triton>=2.2.0"]
hf = ["transformers>=4.40", "accelerate>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "matplotlib>=3.8",
]
all = ["slipstream[triton,hf,dev]"]

[project.scripts]
slipstream-profile = "slipstream.profiler.cli:main"
slipstream-autotune = "slipstream.autotune.cli:main"
slipstream-bench = "slipstream.bench.cli:main"
slipstream-serve = "slipstream.engine.cli:main"

[project.urls]
Repository = "https://github.com/vamshinr/slipstream"
Issues = "https://github.com/vamshinr/slipstream/issues"

[tool.setuptools.packages.find]
include = ["slipstream*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "gpu: requires a ROCm GPU",
    "slow: takes > 10 seconds",
]
